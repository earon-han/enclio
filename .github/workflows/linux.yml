name: Linux
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap libseccomp-dev build-essential pkg-config curl python3 apparmor-utils
      - name: Permit bwrap user namespaces on this temporary CI VM
        run: |
          mkdir -p build/apparmor
          sudo cat /sys/kernel/security/apparmor/profiles > build/apparmor/before.txt
          if grep -i bwrap build/apparmor/before.txt; then
            echo 'Existing bwrap profile requires review; refusing to override it.' >&2
            exit 1
          fi
          sysctl kernel.apparmor_restrict_unprivileged_userns > build/apparmor/sysctl-before.txt
          cat > build/apparmor/tegum-ci-bwrap <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile tegum-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sha256sum build/apparmor/tegum-ci-bwrap > build/apparmor/profile.sha256
          sudo install -m644 build/apparmor/tegum-ci-bwrap /etc/apparmor.d/tegum-ci-bwrap
          sudo apparmor_parser -r /etc/apparmor.d/tegum-ci-bwrap
          sudo cat /sys/kernel/security/apparmor/profiles > build/apparmor/loaded.txt
          sysctl kernel.apparmor_restrict_unprivileged_userns > build/apparmor/sysctl-after.txt
          cmp build/apparmor/sysctl-before.txt build/apparmor/sysctl-after.txt
      - name: VM build, unit, integration and live HTTPS
        run: scripts/validate-linux.sh
      - name: Package native Linux binary
        run: make package
      - name: Docker build
        run: docker build -t tegum-ci .
      - name: Docker default-policy diagnostic
        run: |
          mkdir -p build/docker
          docker run --name tegum-default tegum-ci build/tegum doctor > build/docker/default-doctor.json 2> build/docker/default-doctor.stderr || true
          docker inspect tegum-default > build/docker/default-inspect.json
          docker rm tegum-default
      - name: Docker nested sandbox validation
        run: |
          docker run --name tegum-test --cap-drop ALL \
            --security-opt seccomp="$PWD/scripts/docker-seccomp.json" \
            --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            tegum-ci scripts/validate-linux.sh
      - name: Collect Docker evidence
        if: always()
        run: |
          mkdir -p build/docker
          docker cp tegum-test:/opt/tegum/build/integration.json build/docker/integration.json || true
          docker cp tegum-test:/opt/tegum/build/environment.txt build/docker/environment.txt || true
          docker logs tegum-test > build/docker/test.log 2>&1 || true
          docker inspect tegum-test > build/docker/inspect.json || true
          docker rm -f tegum-test || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-and-package-${{ matrix.runner }}
          path: |
            build/environment.txt
            build/integration.json
            build/docker
            build/apparmor
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Remove the CI-only profile
        if: always()
        run: |
          if test -f /etc/apparmor.d/tegum-ci-bwrap; then
            sudo apparmor_parser -R /etc/apparmor.d/tegum-ci-bwrap
            sudo rm /etc/apparmor.d/tegum-ci-bwrap
          fi
